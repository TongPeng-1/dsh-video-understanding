[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-video-understanding-mcp"
version = "0.5.0"
description = "Windows local video MCP: independent visual text, speech transcription and keyframe images"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mcp==1.30.0", "httpx==0.28.1", "pillow==13.0.0",
  "faster-whisper==1.2.1", "av==16.1.0", "yt-dlp==2026.8.19",
  "huggingface-hub==2.2.0", "pywin32==312; sys_platform == 'win32'",
]
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3.13"]

[project.scripts]
dsh-video-mcp = "dsh_video_mcp.server:main"
dsh-video-install-runtime = "dsh_video_mcp.install_runtime:main"
dsh-video-install-streaming = "dsh_video_mcp.install_videochat3:main"

[project.urls]
Repository = "https://github.com/TongPeng-1/dsh-video-understanding"

[tool.setuptools]
packages = ["dsh_video_mcp"]

[tool.setuptools.package-data]
dsh_video_mcp = ["videochat3-manifest.json", "requirements-videochat3.lock.txt"]
