# Merge into the existing desktop profile; replace INSTALL_DIR first.
- insert:
    - id: mcp-local-video
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: video
        transport: stdio
        command: INSTALL_DIR/.venv/Scripts/dsh-video-mcp.exe
        args:
          - --home
          - INSTALL_DIR
        toolCallTimeoutMs: 120000
